[project]
name = "engineering-journey-v2-harness"
version = "0.1.0"
description = "A small, hand-rolled agent harness for building/running/extending Engineering Journey v2. Scaffolded from the fulcra-rapid-prototype skill."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.3.0",
    # anthropic/openai: added to support the harness's multi-provider
    # adapters (harness/providers/) used by
    # scripts/summarize_periods.py to generate real cross-repo period
    # narratives -- this is harness tooling, NOT app/ code (app/'s own
    # requirements.txt deliberately has zero LLM SDK dependencies, per
    # app/features/m7_rollup_summarization.md's explicit constraint).
    "anthropic>=1.0.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.0.0",
    "fulcra-api>=0.1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness", "harness.providers"]
